id: comment-table-row-trailing
section: "4.8"
description: "Trailing `## comment` after a row's content goes to that Row's reflections; Table has no reflections"

input: |
  | AA | BB | ## what is this?

ast:
  - _type: Table
    rows:
      - _type: Row
        reflections:
          - loc: { start: 15, end: 28 }
            text: "what is this?"
        children:
          - _type: Cell
            children:
              - _type: Text
                value: "AA"
          - _type: Cell
            children:
              - _type: Text
                value: "BB"
