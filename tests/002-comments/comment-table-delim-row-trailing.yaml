id: comment-table-delim-row-trailing
section: "4.8"
description: "Trailing `##` on header row and `|:---|` header separator both bubble to Table.reflection at their respective payload locs"

input: |
  | Head A | Head B | ## header note
  |:-------|--------| ## delim note
  | AA     | BB     |

ast:
  - type: Table
    kind: pipe
    reflection:
      - loc: { start: 23, end: 34 }
        text: "header note"
      - loc: { start: 58, end: 68 }
        text: "delim note"
    rows:
      - type: Header
        children:
          - type: Cell
            children:
              - type: Text
                value: "Head A"
          - type: Cell
            children:
              - type: Text
                value: "Head B"
      - type: Row
        children:
          - type: Cell
            children:
              - type: Text
                value: "AA"
          - type: Cell
            children:
              - type: Text
                value: "BB"
    columns:
      - type: Column
        align: left
      - type: Column
        align: left
