id: comment-anchor-in-block-body
section: "2.3"
description: "A comment between two paragraphs of a NamedBlock anchors to the second paragraph by its child-index path"

input: |
  :::note
  first

  ###
  aside
  ###

  second
  :::

pages:
  - reflections:
      - text: aside
        before: [0, 1]
    children:
      - _type: NamedBlock
        name: note
        children:
          - _type: Paragraph
            children:
              - _type: Text
                value: first
          - _type: Paragraph
            children:
              - _type: Text
                value: second
