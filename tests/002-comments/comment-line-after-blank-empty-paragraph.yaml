id: comment-line-after-blank-empty-paragraph
section: "2.2"
description: "A standalone `##` line after a blank line does not attach backwards; it produces an empty Paragraph"

input: |
  Para

  ## note

ast:
  - _type: Paragraph
    reflection: []
    children:
      - _type: Text
        value: Para
  - _type: Paragraph
    children: []
    reflection:
      - loc: { start: 9, end: 13 }
        text: "note"
