id: comment-inline-degrades-emphasis
section: "2.2"
description: "`##` is opaque to other delimiters; an unclosed `__` opener before it degrades to literal text; payload stored in reflection"

input: |
  __bold ## tail

ast:
  - type: Paragraph
    children:
      - type: Text
        value: "__bold "
    reflection:
      - loc: { start: 10, end: 14 }
        text: "tail"
