id: comment-list-item-trailing
section: "2.2"
description: "A trailing `##` on a list item line goes to that ListItem; List has no reflections"

input: |
  - a ## note
  - b

ast:
  - _type: List
    children:
      - _type: ListItem
        reflections:
          - loc: { start: 7, end: 11 }
            text: "note"
        children:
          - _type: Text
            value: "a"
      - _type: ListItem
        reflections: []
        children:
          - _type: Text
            value: b
