id: comment-block-in-list-item
section: "2.3"
description: "CommentBlock is recognized inside a ListItem, where container indentation is stripped before classification"

input: |
  - item one
    ###
    todo
    ###
  - item two

ast:
  - _type: List
    kind: bullet
    children:
      - _type: ListItem
        children:
          - _type: Text
            value: "item one"
          - _type: CommentBlock
            text: "todo\n"
      - _type: ListItem
        children:
          - _type: Text
            value: "item two"
