id: comment-block-closer-ignores-indentation
section: "2.3"
description: "An indented bare ### closes the block: the closer is matched on stripped content, and indentation is not compared to the opener"

input: |
  ###
  note
    ###

  after

ast:
  - type: CommentBlock
    text: "note\n"
  - type: Paragraph
    children:
      - type: Text
        value: after
