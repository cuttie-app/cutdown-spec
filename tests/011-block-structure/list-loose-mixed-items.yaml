id: list-loose-mixed-items
section: "11.5"
description: "In a loose list each item takes its own shape: a one-paragraph body holds inline content, a two-paragraph body holds blocks; the continuation line folds into the first item with no separator"

input: |
  - First item
    continues here
  - Second item

    This starts a new paragraph inside item two.

ast:
  - _type: List
    kind: "bullet"
    loose: true
    children:
      - _type: ListItem
        children:
          - _type: Text
            value: First itemcontinues here
      - _type: ListItem
        children:
          - _type: Paragraph
            children:
              - _type: Text
                value: Second item
          - _type: Paragraph
            children:
              - _type: Text
                value: This starts a new paragraph inside item two.
