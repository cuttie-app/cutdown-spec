id: comment-line-after-blank-ends-list
section: "7.2"
description: "After a blank line a `##` line is an orphan; it splits the List run, and the next marker opens a new List without a blank line"

input: |
  1. a

  ## note
  2. b

pages:
  - reflections:
      - loc: { start: 9, end: 13 }
        text: "note"
        before: [1]
    children:
      - _type: List
        start: 1
        children:
          - _type: ListItem
            reflections: []
            children:
              - _type: Text
                value: a
      - _type: List
        start: 2
        children:
          - _type: ListItem
            children:
              - _type: Text
                value: b
