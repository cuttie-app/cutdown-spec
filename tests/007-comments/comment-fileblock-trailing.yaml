id: comment-fileblock-trailing
section: "7.2"
description: "A trailing `##` on a file line goes to that FileBlock; FileGroup has no reflections"

input: |
  /a.png ## first
  /b.png

ast:
  - _type: FileGroup
    children:
      - _type: FileBlock
        reflections:
          - loc: { start: 10, end: 15 }
            text: "first"
      - _type: FileBlock
        reflections: []
