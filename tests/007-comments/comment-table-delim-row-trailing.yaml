id: comment-table-delim-row-trailing
section: "4.8"
description: "Trailing `##` on a header row goes to that row; on the header separator it goes to the row above it — here the same Header row"

input: |
  | Head A | Head B | ## header note
  |:-------|--------| ## delim note
  | AA     | BB     |

ast:
  - _type: Table
    rows:
      - _type: Header
        reflections:
          - loc: { start: 23, end: 34 }
            text: "header note"
          - loc: { start: 58, end: 68 }
            text: "delim note"
        children:
          - _type: Cell
            children:
              - _type: Text
                value: "Head A"
          - _type: Cell
            children:
              - _type: Text
                value: "Head B"
      - _type: Row
        reflections: []
        children:
          - _type: Cell
            children:
              - _type: Text
                value: "AA"
          - _type: Cell
            children:
              - _type: Text
                value: "BB"
    columns:
      - _type: Column
        align: left
      - _type: Column
        align: start
