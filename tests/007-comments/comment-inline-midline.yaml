id: comment-inline-midline
section: "7.2"
description: "`##` is recognized mid-line; preceding text stays in children, payload stored in block reflections"

input: |
  foo bar ## trailing comment

ast:
  - _type: Paragraph
    children:
      - _type: Text
        value: "foo bar"
    reflections:
      - loc: { start: 11, end: 27 }
        text: "trailing comment"
