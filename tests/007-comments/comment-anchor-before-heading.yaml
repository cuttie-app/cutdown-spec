id: comment-anchor-before-heading
section: "7.3"
description: "A comment directly before a heading is anchored as that heading's Section"

input: |
  Intro

  ###
  note
  ###

  = Title

  Body

pages:
  - reflections:
      - text: note
        before: [1]
    children:
      - _type: Paragraph
        children:
          - _type: Text
            value: Intro
      - _type: Section
        level: 1
        heading:
          - _type: Text
            value: Title
        children:
          - _type: Paragraph
            children:
              - _type: Text
                value: Body
