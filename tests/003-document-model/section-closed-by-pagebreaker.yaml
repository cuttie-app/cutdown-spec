id: section-closed-by-pagebreaker
section: "9.3.2"
description: A PageBreaker closes all open root-level Sections; content after the break belongs to the new Page, not the old Section

input: |
  = Chapter

  In chapter.

  ---

  Outside.

pages:
  - children:
      - _type: Section
        level: 1
        heading:
          - _type: Text
            value: Chapter
        children:
          - _type: Paragraph
            children:
              - _type: Text
                value: In chapter.
  - children:
      - _type: Paragraph
        children:
          - _type: Text
            value: Outside.
