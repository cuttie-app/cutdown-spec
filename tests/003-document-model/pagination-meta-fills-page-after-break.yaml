id: pagination-meta-fills-page-after-break
section: "3"
description: "A Meta block fills the meta slot of the Page a preceding PageBreaker opened — the PageBreaker makes the boundary, the Meta adds none of its own, so no Ghost Page appears (§9.5.2)"

input: |
  Para one

  ---

  ~~~yaml
  title: Two
  ~~~

  Para two

pages:
  - children:
      - type: Paragraph
        children:
          - type: Text
            value: Para one
  - meta:
      type: Meta
      format: yaml
      raw: "title: Two\n"
    children:
      - type: Paragraph
        children:
          - type: Text
            value: Para two
