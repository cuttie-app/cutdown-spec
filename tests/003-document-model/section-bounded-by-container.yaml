id: section-bounded-by-container
section: "4.2"
description: A Section inside a block container does not affect the outer Section hierarchy; content after the container belongs to the outer scope

input: |
  = Outer

  - item

    == Inner Section

    inner content

  outer content

ast:
  - _type: Section
    level: 1
    heading:
      - _type: Text
        value: Outer
    children:
      - _type: List
        kind: "bullet"
        loose: true
        children:
          - _type: ListItem
            children:
              - _type: Paragraph
                children:
                  - _type: Text
                    value: item
              - _type: Section
                level: 2
                heading:
                  - _type: Text
                    value: Inner Section
                children:
                  - _type: Paragraph
                    children:
                      - _type: Text
                        value: inner content
      - _type: Paragraph
        children:
          - _type: Text
            value: outer content
