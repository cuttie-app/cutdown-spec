id: section-nesting
section: "4.2"
description: Level-2 heading opens a child Section inside a level-1 Section

input: |
  = Title

  Some paragraph.

  == Sub A

  Content A.

ast:
  - _type: Section
    level: 1
    heading:
      - _type: Text
        value: Title
    children:
      - _type: Paragraph
        children:
          - _type: Text
            value: Some paragraph.
      - _type: Section
        level: 2
        heading:
          - _type: Text
            value: Sub A
        children:
          - _type: Paragraph
            children:
              - _type: Text
                value: Content A.
