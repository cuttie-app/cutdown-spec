id: pagination-meta-first-fills-initial-page
section: "3"
description: A Meta block at the head of the document fills the initial Page's empty meta slot; no new Page is created

input: |
  ~~~yaml
  title: One
  ~~~

  Para

pages:
  - meta:
      _type: Meta
      format: yaml
      raw: "title: One\n"
    children:
      - _type: Paragraph
        children:
          - _type: Text
            value: Para
