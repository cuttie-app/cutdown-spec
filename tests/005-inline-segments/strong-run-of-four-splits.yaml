id: strong-run-of-four-splits
section: "5.3"
description: "A **** run flanked by real word content on both sides is a closer immediately followed by an opener: two separate Strong nodes, not one nested/empty span"

input: |
  **one part text **** other part**

ast:
  - _type: Paragraph
    children:
      - _type: Strong
        children:
          - _type: Text
            value: "one part text"
      - _type: Strong
        children:
          - _type: Text
            value: "other part"
