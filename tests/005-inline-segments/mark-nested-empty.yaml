id: mark-nested-empty
section: "5.10"
description: "::a ::c:::: nests an empty Mark inside a Mark; the trailing :::: is inner closer + outer closer"

input: |
  ::a ::c::::

ast:
  - _type: Paragraph
    children:
      - _type: Mark
        name: a
        children:
          - _type: Mark
            name: c
            children: []
