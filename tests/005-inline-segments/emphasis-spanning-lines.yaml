id: emphasis-spanning-lines
section: "5.12"
description: An inline span crosses a soft break, which folds to zero; leading whitespace on the continuation line marks the word boundary

input: "__bold\n continuation__ and __nospace\ncontinuation__\n"

ast:
  - _type: Paragraph
    children:
      - _type: Emphasis
        children:
          - _type: Text
            value: bold continuation
      - _type: Text
        value: " and "
      - _type: Emphasis
        children:
          - _type: Text
            value: nospacecontinuation
