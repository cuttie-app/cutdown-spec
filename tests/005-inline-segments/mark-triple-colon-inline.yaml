id: mark-triple-colon-inline
section: "5.10"
description: "A run of three colons in inline position is the :: closer plus a literal :"

input: |
  ::a b:::

ast:
  - _type: Paragraph
    children:
      - _type: Mark
        name: a
        children:
          - _type: Text
            value: "b"
      - _type: Text
        value: ":"
