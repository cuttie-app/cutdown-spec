id: image-inline
section: "5.9"
description: "![alt](src) in inline context produces ImageInline with alt as Inline[]"

input: |
  See ![a cat](cat.jpg) here.

ast:
  - _type: Paragraph
    children:
      - _type: Text
        value: "See "
      - _type: ImageInline
        alt:
          - _type: Text
            value: a cat
        raw: cat.jpg
        src:
          path: /cat.jpg
          query: []
          fragment: ''
      - _type: Text
        value: " here."
