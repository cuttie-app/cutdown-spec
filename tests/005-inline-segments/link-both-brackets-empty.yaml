id: link-both-brackets-empty
section: "5.5"
description: "[][] with both brackets empty is a valid page link with an empty path locator; allows empty inline anchors with custom attributes when attrs trail the construct"

input: |
  [][]{#anchor .marker}

ast:
  - _type: Paragraph
    children:
      - _type: Link
        kind: page
        children: []
        raw: ""
        path:
          path: ""
          query: []
          fragment: ""
        attributes:
          - key: id
            value: anchor
          - key: class
            value:
              - marker
