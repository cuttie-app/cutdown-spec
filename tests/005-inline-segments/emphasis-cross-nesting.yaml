id: emphasis-cross-nesting
section: "5.2"
description: Cross-type nesting is allowed; Strong inside Emphasis and vice versa

input: |
  __**bold and strong**__

ast:
  - _type: Paragraph
    children:
      - _type: Emphasis
        children:
          - _type: Strong
            children:
              - _type: Text
                value: bold and strong
