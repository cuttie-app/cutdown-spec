id: spoiler-run-of-three
section: "5.12"
description: "^^^ in inline context = ^^ (opener) + ^ (literal inside); closing ^^^ = ^^ (closer) + ^ (literal after)"

input: |
  a ^^^x^^^

ast:
  - _type: Paragraph
    children:
      - _type: Text
        value: "a "
      - _type: Spoiler
        children:
          - _type: Text
            value: "^x"
      - _type: Text
        value: "^"
