id: mark-attrs
section: "5.10"
description: "Mark carries attributes trailing after the closer"

input: |
  Hello ::marker world::{#here .highlight} end

ast:
  - type: Paragraph
    children:
      - type: Text
        value: "Hello "
      - type: Mark
        name: marker
        children:
          - type: Text
            value: "world"
        attributes:
          - key: id
            value: here
          - key: class
            value: [highlight]
      - type: Text
        value: " end"
