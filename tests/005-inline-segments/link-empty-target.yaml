id: link-empty-target
section: "5.5"
description: "[]() is a wiki link with no text: it names nothing, so path is null with CDN-0032; trailing attributes still attach"

input: |
  [](){#anchor .marker}

ast:
  - _type: Paragraph
    children:
      - _type: Link
        kind: page
        children: []
        href: ""
        raw: ""
        path: null
        target: ""
        attributes:
          - key: id
            value: anchor
          - key: class
            value:
              - marker

diagnostics:
  - code: CDN-0032
    level: warning
