id: link-empty-target
section: "5.5"
description: "[]() with empty text and an empty target is a page link with an empty path locator; trailing attributes still attach"

input: |
  [](){#anchor .marker}

ast:
  - _type: Paragraph
    children:
      - _type: Link
        kind: page
        children: []
        href: ""
        raw: ""
        path:
          path: ""
          query: []
          fragment: ""
        target: ""
        attributes:
          - key: id
            value: anchor
          - key: class
            value:
              - marker
