id: link-page
section: "5.5"
description: "[text](path) without a sigil or scheme produces a Link with kind=page; the parser appends .cutdown to path.path"

input: |
  [About](about/intro)

ast:
  - _type: Paragraph
    children:
      - _type: Link
        kind: page
        raw: about/intro
        path:
          path: /about/intro.cutdown
          query: []
          fragment: ''
        target: ''
        href: ''
        children:
          - _type: Text
            value: About
