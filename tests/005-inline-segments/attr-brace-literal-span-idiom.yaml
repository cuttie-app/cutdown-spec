id: attr-brace-literal-span-idiom
section: "12.1.4.1"
description: "A closed { } whose content violates the attribute grammar is the literal-span idiom: the whole slice, braces included, is one verbatim Text run and is never inline-parsed"

input: |
  {a **b**}

ast:
  - _type: Paragraph
    children:
      - _type: Text
        value: "{a **b**}"
