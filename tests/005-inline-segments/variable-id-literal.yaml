id: variable-id-literal
section: "5.11"
description: Variable key must be an ID_NAME; a key containing other characters is emitted as literal text

input: |
  {{valid-key}} {{invalid key}} {{also.valid_1}}

ast:
  - _type: Paragraph
    children:
      - _type: Variable
        key: valid-key
      - _type: Text
        value: " {{invalid key}} "
      - _type: Variable
        key: also.valid_1

diagnostics:
  - code: CDN-0015
    level: warning
