id: mark-empty
section: "5.10"
description: "::name:: produces an empty Mark, preserving the placeholder form"

input: |
  Hello ::a:: world

ast:
  - _type: Paragraph
    children:
      - _type: Text
        value: "Hello "
      - _type: Mark
        name: a
        children: []
      - _type: Text
        value: " world"
