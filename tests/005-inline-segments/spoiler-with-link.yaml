id: spoiler-with-link
section: "5.12"
description: "Links (higher precedence than emphasis family) parse inside Spoiler children"

input: |
  ^^[text](/url)^^

ast:
  - _type: Paragraph
    children:
      - _type: Spoiler
        children:
          - _type: Link
            kind: external
            children:
              - _type: Text
                value: text
            href: /url
