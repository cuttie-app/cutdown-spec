id: link-ref
section: "5.5"
description: "[text][^id] produces a Link with kind=ref; ^ sigil is consumed"

input: |
  [note text](^note-id)

ast:
  - _type: Paragraph
    children:
      - _type: Link
        kind: ref
        target: note-id
        children:
          - _type: Text
            value: note text
