id: mark-nest-depth-max
section: "5.10"
description: "Nesting depth 8 is the maximum and parses normally; no diagnostic"

input: |
  ::a ::a ::a ::a ::a ::a ::a ::a ::::::::::::::::

ast:
  - _type: Paragraph
    children:
      - _type: Mark
        name: a
        children:
          - _type: Mark
            name: a
            children:
              - _type: Mark
                name: a
                children:
                  - _type: Mark
                    name: a
                    children:
                      - _type: Mark
                        name: a
                        children:
                          - _type: Mark
                            name: a
                            children:
                              - _type: Mark
                                name: a
                                children:
                                  - _type: Mark
                                    name: a
                                    children: []
