id: inline-depth-derived-bound
section: "20.6"
description: "The deepest inline tree the grammar allows: 8 Marks, then the 6 span kinds once each, a Link, and an ImageInline in its text — depth 16; a span kind never repeats, not even in link text or alt"

input: |
  ::m ::m ::m ::m ::m ::m ::m ::m **__~~^^""''[![x](/i.png)](u)''""^^~~__** :: :: :: :: :: :: :: ::

ast:
  - _type: Paragraph
    children:
      - _type: Mark
        name: m
        children:
          - _type: Mark
            name: m
            children:
              - _type: Mark
                name: m
                children:
                  - _type: Mark
                    name: m
                    children:
                      - _type: Mark
                        name: m
                        children:
                          - _type: Mark
                            name: m
                            children:
                              - _type: Mark
                                name: m
                                children:
                                  - _type: Mark
                                    name: m
                                    children:
                                      - _type: Strong
                                        children:
                                          - _type: Emphasis
                                            children:
                                              - _type: Highlight
                                                children:
                                                  - _type: Spoiler
                                                    children:
                                                      - _type: QuoteInline
                                                        kind: double
                                                        children:
                                                          - _type: QuoteInline
                                                            kind: single
                                                            children:
                                                              - _type: Link
                                                                kind: page
                                                                raw: u
                                                                children:
                                                                  - _type: ImageInline
                                                                    alt:
                                                                      - _type: Text
                                                                        value: "x"
                                                                    src:
                                                                      path: "/i.png"
                                                                      query: []
                                                                      fragment: ""
