id: quote-inline-cross-nesting
section: "5.8"
description: Cross-kind nesting is allowed; single QuoteInline inside double

input: |
  ""'' inner ''""

ast:
  - _type: Paragraph
    children:
      - _type: QuoteInline
        kind: double
        children:
          - _type: QuoteInline
            kind: single
            children:
              - _type: Text
                value: inner
