id: link-closed-twin-inner-survives
section: "12.1.4.1"
description: "The closed twin of the verbatim-slice case: with the link properly closed, the inner Emphasis parses normally"

input: |
  [a __b__ c](https://example.com)

ast:
  - _type: Paragraph
    children:
      - _type: Link
        kind: external
        href: https://example.com
        children:
          - _type: Text
            value: "a "
          - _type: Emphasis
            children:
              - _type: Text
                value: b
          - _type: Text
            value: " c"
