id: mark-name-stops-at-asterisk
section: "5.10"
description: "* is not an ID_LITERAL character, so the name scan stops at a; the opener is invalid and degrades to Text, Strong parses, and the trailing :: is an unmatched closer"

input: |
  ::a**b**::

ast:
  - _type: Paragraph
    children:
      - _type: Text
        value: "::a"
      - _type: Strong
        children:
          - _type: Text
            value: "b"
      - _type: Text
        value: "::"
