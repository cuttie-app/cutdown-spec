id: mark-basic
section: "5.10"
description: "::name <content>:: produces a Mark wrapping the parsed inline content"

input: |
  Hello ::marker world:: end

ast:
  - _type: Paragraph
    children:
      - _type: Text
        value: "Hello "
      - _type: Mark
        name: marker
        children:
          - _type: Text
            value: "world"
      - _type: Text
        value: " end"
