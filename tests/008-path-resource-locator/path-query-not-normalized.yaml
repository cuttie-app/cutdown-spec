id: path-query-not-normalized
section: "8.4"
description: "Only path is normalized: dot segments in the query and fragment stay as written"

input: |
  /a/./b.png?f=./x#../y

ast:
  - _type: FileGroup
    children:
      - _type: FileBlock
        raw: "/a/./b.png?f=./x#../y"
        src:
          path: /a/b.png
          query:
            - key: f
              value: ./x
          fragment: ../y
