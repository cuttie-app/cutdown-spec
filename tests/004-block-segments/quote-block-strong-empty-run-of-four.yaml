id: quote-block-strong-empty-run-of-four
section: "4.6"
description: "**** with no word content on either side produces an empty Strong node (N=4 rule, cf. emphasis-empty) followed by literal text, inside a QuoteBlock; the trailing > is plain text, not a new quote"

input: |
  > **** >

ast:
  - _type: QuoteBlock
    children:
      - _type: Paragraph
        children:
          - _type: Strong
          - _type: Text
            value: " >"
