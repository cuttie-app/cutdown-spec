id: imageblock-inline-alt
section: "4.9"
description: ImageBlock alt is parsed by inline rules; emphasis and plain text are valid alt content

input: |
  ![A __bold__ caption](photos/shot.jpg)

ast:
  - _type: ImageBlock
    alt:
      - _type: Text
        value: "A "
      - _type: Emphasis
        children:
          - _type: Text
            value: bold
      - _type: Text
        value: " caption"
    src: photos/shot.jpg
