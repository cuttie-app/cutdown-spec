id: table-pipe-no-closer
section: "4.8"
description: "The trailing | is optional; a row without a closer has the same cell count as one with it"

input: |
  | A | B

ast:
  - _type: Table
    rows:
      - _type: Row
        children:
          - _type: Cell
            children:
              - _type: Text
                value: A
          - _type: Cell
            children:
              - _type: Text
                value: B
    columns:
      - _type: Column
        align: start
      - _type: Column
        align: start
