id: table-cell-inline-attrs-orphan
section: "4.8"
description: "A cell chain has exactly one slot, so a second group has nothing to claim and emits CDN-0011"

input: |
  | AA | **BB** {.a}{.b} |

diagnostics:
  - code: CDN-0011
    level: warning

ast:
  - type: Table
    kind: pipe
    rows:
      - type: Row
        children:
          - type: Cell
            children:
              - type: Text
                value: AA
          - type: Cell
            children:
              - type: Strong
                children:
                  - type: Text
                    value: BB
                attributes:
                  - key: class
                    value: [b]
        attributes: []
    attributes: []
