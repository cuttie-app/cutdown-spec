id: table-attrs-last-row
section: "4.8"
description: "Last row: two trailing {} distribute to Table and Row; single {} goes to Table only; empty {} is no-op on Table"

input: |
  | td1 | td2 | {.a}{.b}

ast:
  - _type: Table
    rows:
      - _type: Row
        children:
          - _type: Cell
            children:
              - _type: Text
                value: td1
          - _type: Cell
            children:
              - _type: Text
                value: td2
        attributes:
          - key: class
            value: [a]
    attributes:
      - key: class
        value: [b]
