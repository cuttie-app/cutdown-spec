id: table-attrs-last-row-single
section: "4.8"
description: "Single {} on last row goes to Table"

input: |
  | td1 | td2 | {.a}

ast:
  - _type: Table
    rows:
      - _type: Row
        children:
          - _type: Cell
            children:
              - _type: Text
                value: td1
          - _type: Cell
            children:
              - _type: Text
                value: td2
    attributes:
      - key: class
        value: [a]
