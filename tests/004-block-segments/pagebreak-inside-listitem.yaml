id: pagebreak-inside-listitem
section: "4.10"
description: A blank-line-surrounded --- inside a list item is not a PageBreak; it parses as a literal paragraph and CDN-0017 is emitted

input: |
  - item

    ---

    after

diagnostics:
  - code: CDN-0017
    level: warning

ast:
  - type: List
    kind: "bullet"
    loose: true
    children:
      - type: ListItem
        children:
          - type: Paragraph
            children:
              - type: Text
                value: item
          - type: Paragraph
            children:
              - type: Text
                value: "---"
          - type: Paragraph
            children:
              - type: Text
                value: after
