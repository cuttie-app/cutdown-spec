id: table-row-short-padded
section: "4.8"
description: "A row with fewer cells than the column count is padded with empty cells; no diagnostic, nothing is lost"

input: |
  | A | B |
  | C |

diagnostics: []

ast:
  - _type: Table
    rows:
      - _type: Row
        children:
          - _type: Cell
            children:
              - _type: Text
                value: A
          - _type: Cell
            children:
              - _type: Text
                value: B
      - _type: Row
        children:
          - _type: Cell
            children:
              - _type: Text
                value: C
          - _type: Cell
            children: []
    columns:
      - _type: Column
        align: start
      - _type: Column
        align: start
