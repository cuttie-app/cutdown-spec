id: pagebreaker-inside-quoteblock
section: "4.10"
description: A blank-line-surrounded --- inside a QuoteBlock is not a PageBreaker; it parses as a literal paragraph and CDN-0017 is emitted

input: |
  > para
  >
  > ---
  >
  > after

diagnostics:
  - code: CDN-0017
    level: warning

ast:
  - _type: QuoteBlock
    children:
      - _type: Paragraph
        children:
          - _type: Text
            value: para
      - _type: Paragraph
        children:
          - _type: Text
            value: "---"
      - _type: Paragraph
        children:
          - _type: Text
            value: after
