id: named-block-nested
section: "4.13"
description: NamedBlocks can be nested; inner block is a child of the outer block

input: |
  :::outer

  :::inner
  text
  :::

  :::

ast:
  - _type: NamedBlock
    name: outer
    children:
      - _type: NamedBlock
        name: inner
        children:
          - _type: Paragraph
            children:
              - _type: Text
                value: text
