id: list-nested
section: "4.7.1"
description: A marker at a greater column than the current item creates a nested List inside a ListItem (2-space indent is the recommended convention)

input: |
  - Item one
    - Nested
  - Item two

ast:
  - _type: List
    kind: "bullet"
    start: 1
    children:
      - _type: ListItem
        children:
          - _type: Paragraph
            children:
              - _type: Text
                value: Item one
          - _type: List
            kind: "bullet"
            start: 1
            children:
              - _type: ListItem
                children:
                  - _type: Text
                    value: Nested
      - _type: ListItem
        children:
          - _type: Text
            value: Item two
