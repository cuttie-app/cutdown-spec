id: table-scope-chain-attrs
section: "4.8"
description: "On the last row, two trailing {} tokens distribute right-to-left: last to Table, preceding to Row"

input: |
  | td1 | td2 | {.row-class}{.table-class}

ast:
  - _type: Table
    rows:
      - _type: Row
        children:
          - _type: Cell
            row: 0
            column: 0
            children:
              - _type: Text
                value: td1
          - _type: Cell
            row: 0
            column: 1
            children:
              - _type: Text
                value: td2
        attributes:
          - key: class
            value: [row-class]
    columns:
      - _type: Column
      - _type: Column
    attributes:
      - key: class
        value: [table-class]
