id: table-multiline-plus-row-wider-inert
section: "4.8"
description: "A + row drawn wider than the first content row is inert decoration: it neither counts columns nor positions boundaries, and emits no diagnostic"

input: |
  +------+------+------+
  | A    | B    |
  +------+------+------+

diagnostics: []

ast:
  - type: Table
    kind: multiline
    rows:
      - type: Row
        children:
          - type: Cell
            children:
              - type: Paragraph
                children:
                  - type: Text
                    value: A
          - type: Cell
            children:
              - type: Paragraph
                children:
                  - type: Text
                    value: B
    columns:
      - type: Column
        align: left
      - type: Column
        align: left
