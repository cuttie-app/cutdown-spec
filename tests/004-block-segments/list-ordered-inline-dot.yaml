id: list-ordered-inline-dot
section: "4.7"
description: After the ordered list marker `N. `, the `N.` pattern has no special meaning in inline content; `1. 2. 3. item` is a single list item

input: |
  1. 2. 3. nested item

ast:
  - _type: List
    kind: "numbered"
    start: 1
    children:
      - _type: ListItem
        children:
          - _type: Text
            value: "2. 3. nested item"
