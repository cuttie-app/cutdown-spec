id: table-scope-chain-inline-open-cell
section: "4.8"
description: "With the closer omitted the last cell's inline context is open, so the chain walks past Cell to the last attr-bearing inline"

input: |
  | AA | **BB** {.a}{.b}{.c}

diagnostics: []

ast:
  - _type: Table
    rows:
      - _type: Row
        children:
          - _type: Cell
            children:
              - _type: Text
                value: AA
          - _type: Cell
            children:
              - _type: Strong
                children:
                  - _type: Text
                    value: BB
                attributes:
                  - key: class
                    value: [a]
        attributes:
          - key: class
            value: [b]
    attributes:
      - key: class
        value: [c]
