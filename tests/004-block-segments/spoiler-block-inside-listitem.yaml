id: spoiler-block-inside-listitem
section: "4.15"
description: SpoilerBlock inside a list item is legal; list item's base offset (2 spaces) is stripped from content lines

input: |
  - item

    ^^^
    hidden
    ^^^

ast:
  - _type: List
    kind: "bullet"
    loose: true
    children:
      - _type: ListItem
        children:
          - _type: Paragraph
            children:
              - _type: Text
                value: item
          - _type: SpoilerBlock
            children:
              - _type: Text
                value: hidden
