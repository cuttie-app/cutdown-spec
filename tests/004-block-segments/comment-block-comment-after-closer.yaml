id: comment-block-comment-after-closer
section: "4.16"
description: "A ## line directly after a CommentBlock closer is an orphan; both comments become SegmentReflections before the same anchor"

input: |
  ###
  hidden
  ###
  ## note

pages:
  - reflections:
      - text: hidden
        before: [0]
      - text: note
        before: [0]
    children: []
