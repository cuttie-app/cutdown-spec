id: fileblock-braces-in-path
section: "1.7.1"
description: "A {...} group that is not preceded by whitespace, or does not close the line, is path content"

input: |
  /a {draft}.png
  /img/{{lang}}/hero.png

ast:
  - _type: FileGroup
    children:
      - _type: FileBlock
        src:
          raw: /a {draft}.png
          path: /a {draft}.png
        attributes: []
      - _type: FileBlock
        src:
          raw: /img/{{lang}}/hero.png
          path: /img/{{lang}}/hero.png
        attributes: []
