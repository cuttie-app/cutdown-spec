id: meta-block-inside-container
section: "4.3"
description: ~~~ fence inside a block container is illegal; entire raw span emitted as a Paragraph; CDN-0030 warning emitted

input: |
  - item

    ~~~yaml
    title: foo
    ~~~

ast:
  - _type: List
    kind: "bullet"
    loose: true
    children:
      - _type: ListItem
        children:
          - _type: Paragraph
            children:
              - _type: Text
                value: item
          - _type: Paragraph
            children:
              - _type: Text
                value: "~~~yaml\ntitle: foo\n~~~"

diagnostics:
  - code: CDN-0030
    level: warning
