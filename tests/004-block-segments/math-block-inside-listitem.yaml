id: math-block-inside-listitem
section: "4.5"
description: MathBlock inside a list item is legal; list item's base offset is stripped from content lines

input: |
  - item

    $$$
    x^2 + y^2
    $$$

ast:
  - _type: List
    kind: "bullet"
    loose: true
    children:
      - _type: ListItem
        children:
          - _type: Paragraph
            children:
              - _type: Text
                value: item
          - _type: MathBlock
            raw: "x^2 + y^2"
