id: heading-first-line-of-container
section: "4.2"
description: A heading as the first line of a block container needs no preceding blank line

input: |
  :::note
  = Title
  content
  :::

ast:
  - _type: NamedBlock
    name: note
    children:
      - _type: Section
        level: 1
        heading:
          - _type: Text
            value: "Titlecontent"
