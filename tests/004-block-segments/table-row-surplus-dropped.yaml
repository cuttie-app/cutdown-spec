id: table-row-surplus-dropped
section: "4.8"
description: "The first content row fixes the column count; surplus cells in a later row are dropped and CDN-0018 is emitted"

input: |
  | A | B |
  | C | D | E |

diagnostics:
  - code: CDN-0018
    level: warning

ast:
  - type: Table
    kind: pipe
    rows:
      - type: Row
        children:
          - type: Cell
            children:
              - type: Text
                value: A
          - type: Cell
            children:
              - type: Text
                value: B
      - type: Row
        children:
          - type: Cell
            children:
              - type: Text
                value: C
          - type: Cell
            children:
              - type: Text
                value: D
    columns:
      - type: Column
        align: left
      - type: Column
        align: left
