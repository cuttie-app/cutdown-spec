id: table-row-surplus-dropped
section: "4.8"
description: "The first content row fixes the column count; surplus cells in a later row are dropped and CDN-0018 is emitted"

input: |
  | A | B |
  | C | D | E |

diagnostics:
  - code: CDN-0018
    level: warning

ast:
  - _type: Table
    rows:
      - _type: Row
        children:
          - _type: Cell
            children:
              - _type: Text
                value: A
          - _type: Cell
            children:
              - _type: Text
                value: B
      - _type: Row
        children:
          - _type: Cell
            children:
              - _type: Text
                value: C
          - _type: Cell
            children:
              - _type: Text
                value: D
    columns:
      - _type: Column
        align: start
      - _type: Column
        align: start
