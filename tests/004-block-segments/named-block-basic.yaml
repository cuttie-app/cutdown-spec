id: named-block-basic
section: "4.13"
description: ":::name opens a NamedBlock; ::: on its own line closes it"

input: |
  :::callout
  Some content
  :::

ast:
  - _type: NamedBlock
    name: callout
    children:
      - _type: Paragraph
        children:
          - _type: Text
            value: Some content
