id: quote-block-with-ordered-list
section: "4.6"
description: An ordered list inside a QuoteBlock is parsed normally; consecutive > lines with ordered markers form a tight ordered List

input: |
  > 1. first
  > 2. second

ast:
  - _type: QuoteBlock
    children:
      - _type: List
        kind: "numbered"
        loose: false
        start: 1
        children:
          - _type: ListItem
            children:
              - _type: Text
                value: first
          - _type: ListItem
            children:
              - _type: Text
                value: second
