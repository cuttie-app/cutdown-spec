id: table-cell-inline-attrs-before-closer
section: "4.8"
description: "A chain written before the closer is inside the cell's inline context, so it distributes through the cell's slots — the only slot being the last attr-bearing inline"

input: |
  | AA | **BB** {.a} |

diagnostics: []

ast:
  - _type: Table
    rows:
      - _type: Row
        children:
          - _type: Cell
            children:
              - _type: Text
                value: AA
          - _type: Cell
            children:
              - _type: Strong
                children:
                  - _type: Text
                    value: BB
                attributes:
                  - key: class
                    value: [a]
        attributes: []
    attributes: []
