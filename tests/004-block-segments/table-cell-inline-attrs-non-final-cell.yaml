id: table-cell-inline-attrs-non-final-cell
section: "4.8"
description: "Every cell is its own inline context, so a chain at the end of a non-final cell binds inside that cell"

input: |
  | **AA** {.x} | BB |

diagnostics: []

ast:
  - _type: Table
    rows:
      - _type: Row
        children:
          - _type: Cell
            children:
              - _type: Strong
                children:
                  - _type: Text
                    value: AA
                attributes:
                  - key: class
                    value: [x]
          - _type: Cell
            children:
              - _type: Text
                value: BB
        attributes: []
    attributes: []
