id: comment-block-opener-with-text
section: "4.16"
description: "A line beginning with ### opens a CommentBlock even with text after it; the tail is dropped with CDN-0016"

input: |
  ### note
  body
  ###

pages:
  - reflections:
      - text: body
        before: [0]
    children: []

diagnostics:
  - code: CDN-0016
    level: warning
