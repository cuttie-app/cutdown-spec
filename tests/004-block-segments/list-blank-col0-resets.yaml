id: list-blank-col0-resets
section: "4.7"
description: Blank line followed by a col-0 list marker ends the current List and starts a new one

input: |
  - item A

  - item B

ast:
  - _type: List
    kind: "bullet"
    loose: false
    children:
      - _type: ListItem
        children:
          - _type: Text
            value: item A
  - _type: List
    kind: "bullet"
    loose: false
    children:
      - _type: ListItem
        children:
          - _type: Text
            value: item B
