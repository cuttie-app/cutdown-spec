id: table-pipe-dash-placeholder-not-separator
section: "4.8"
description: "The 3-dash minimum guard: a row of single-dash placeholder cells is content, not a header separator; preceding rows stay type Row"

input: |
  | A | B |
  | - | - |

ast:
  - _type: Table
    rows:
      - _type: Row
        children:
          - _type: Cell
            row: 0
            column: 0
            children:
              - _type: Text
                value: A
          - _type: Cell
            row: 0
            column: 1
            children:
              - _type: Text
                value: B
      - _type: Row
        children:
          - _type: Cell
            row: 1
            column: 0
            children:
              - _type: Text
                value: "-"
          - _type: Cell
            row: 1
            column: 1
            children:
              - _type: Text
                value: "-"
    columns:
      - _type: Column
      - _type: Column
