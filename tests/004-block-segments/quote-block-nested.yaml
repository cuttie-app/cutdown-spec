id: quote-block-nested
section: "4.6"
description: ">> produces a QuoteBlock nested inside an outer QuoteBlock (nesting depth = count of leading > chars)"

input: |
  >> Nested quote

ast:
  - _type: QuoteBlock
    children:
      - _type: QuoteBlock
        children:
          - _type: Paragraph
            children:
              - _type: Text
                value: Nested quote
