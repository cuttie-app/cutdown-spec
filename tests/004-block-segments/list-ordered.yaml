id: list-ordered
section: "4.7"
description: Lines starting with "{n}. " form a tight ordered List; start captures first item number

input: |
  1. First
  2. Second

ast:
  - _type: List
    kind: "numbered"
    start: 1
    children:
      - _type: ListItem
        children:
          - _type: Text
            value: First
      - _type: ListItem
        children:
          - _type: Text
            value: Second
