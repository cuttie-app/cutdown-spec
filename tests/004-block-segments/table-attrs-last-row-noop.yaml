id: table-attrs-last-row-noop
section: "4.8"
description: "Empty {} is no-op on Table; preceding {.a} goes to Row"

input: |
  | td1 | td2 | {.a}{}

ast:
  - _type: Table
    rows:
      - _type: Row
        children:
          - _type: Cell
            children:
              - _type: Text
                value: td1
          - _type: Cell
            children:
              - _type: Text
                value: td2
        attributes:
          - key: class
            value: [a]
