id: pagebreaker-inside-namedblock
section: "4.10"
description: A blank-line-surrounded --- inside a NamedBlock is not a PageBreaker; it parses as a literal paragraph and CDN-0017 is emitted

input: |
  :::note
  before

  ---

  after
  :::

diagnostics:
  - code: CDN-0017
    level: warning

ast:
  - _type: NamedBlock
    name: note
    children:
      - _type: Paragraph
        children:
          - _type: Text
            value: before
      - _type: Paragraph
        children:
          - _type: Text
            value: "---"
      - _type: Paragraph
        children:
          - _type: Text
            value: after
