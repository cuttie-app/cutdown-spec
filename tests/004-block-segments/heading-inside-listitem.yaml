id: heading-inside-listitem
section: "4.2"
description: A heading inside a list item is legal; produces a Section as a block child of the ListItem

input: |
  - intro

    = Inner Section

    paragraph

ast:
  - _type: List
    kind: "bullet"
    loose: true
    children:
      - _type: ListItem
        children:
          - _type: Paragraph
            children:
              - _type: Text
                value: intro
          - _type: Section
            level: 1
            heading:
              - _type: Text
                value: Inner Section
            children:
              - _type: Paragraph
                children:
                  - _type: Text
                    value: paragraph
