id: list-loose
section: "4.7"
description: Blank line between col-0 items resets the list; produces two separate tight List nodes (loose lists require indented items)

input: |
  - Item one

  - Item two

ast:
  - _type: List
    kind: "bullet"
    loose: false
    children:
      - _type: ListItem
        children:
          - _type: Text
            value: Item one
  - _type: List
    kind: "bullet"
    loose: false
    children:
      - _type: ListItem
        children:
          - _type: Text
            value: Item two
