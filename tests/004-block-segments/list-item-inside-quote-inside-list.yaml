id: list-item-inside-quote-inside-list
section: "4.7"
description: A list item inside a QuoteBlock inside a list item is legal; the outer list is tight (single item, no blank lines)

input: |
  - > - item

ast:
  - _type: List
    kind: "bullet"
    loose: false
    children:
      - _type: ListItem
        children:
          - _type: QuoteBlock
            children:
              - _type: List
                kind: "bullet"
                children:
                  - _type: ListItem
                    children:
                      - _type: Text
                        value: item
