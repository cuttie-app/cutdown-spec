id: quote-block-with-tasklist
section: "4.6"
description: Task items inside a QuoteBlock are parsed normally; checked and unchecked TaskItems retain their nature within the QuoteBlock's sub-parser

input: |
  > - [ ] todo
  > - [x] done

ast:
  - _type: QuoteBlock
    children:
      - _type: List
        kind: "checklist"
        loose: false
        start: null
        children:
          - _type: TaskItem
            checked: false
            children:
              - _type: Text
                value: todo
          - _type: TaskItem
            checked: true
            children:
              - _type: Text
                value: done
