id: named-block-attrs
section: "4.13"
description: "Attributes on the opening ::: line are attached to the NamedBlock node"

input: |
  :::callout {.warning #note1}
  Content
  :::

ast:
  - _type: NamedBlock
    name: callout
    attributes:
      - key: class
        value: [warning]
      - key: id
        value: note1
    children:
      - _type: Paragraph
        children:
          - _type: Text
            value: Content
