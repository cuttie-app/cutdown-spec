id: table-pipe
section: "4.8"
description: "Pipe table; `|:---|` header separator sets alignment and marks preceding rows as type Header; subsequent rows are type Row"

input: |
  | Name  | Score |
  |:------|------:|
  | Alice |    42 |
  | Bob   |    17 |

ast:
  - _type: Table
    rows:
      - _type: Header
        children:
          - _type: Cell
            row: 0
            column: 0
            children:
              - _type: Text
                value: Name
          - _type: Cell
            row: 0
            column: 1
            children:
              - _type: Text
                value: Score
      - _type: Row
        children:
          - _type: Cell
            row: 1
            column: 0
            children:
              - _type: Text
                value: Alice
          - _type: Cell
            row: 1
            column: 1
            children:
              - _type: Text
                value: "42"
      - _type: Row
        children:
          - _type: Cell
            row: 2
            column: 0
            children:
              - _type: Text
                value: Bob
          - _type: Cell
            row: 2
            column: 1
            children:
              - _type: Text
                value: "17"
    columns:
      - _type: Column
        align: left
      - _type: Column
        align: right
