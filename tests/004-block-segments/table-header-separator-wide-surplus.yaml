id: table-header-separator-wide-surplus
section: "4.8"
description: "A header separator never defines the column count; a separator wider than the count drops its surplus and emits CDN-0018"

input: |
  | A | B |
  |:---|---:|:---:|

diagnostics:
  - code: CDN-0018
    level: warning

ast:
  - type: Table
    kind: pipe
    rows:
      - type: Header
        children:
          - type: Cell
            children:
              - type: Text
                value: A
          - type: Cell
            children:
              - type: Text
                value: B
    columns:
      - type: Column
        align: left
      - type: Column
        align: right
