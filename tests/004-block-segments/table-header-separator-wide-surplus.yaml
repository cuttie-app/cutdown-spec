id: table-header-separator-wide-surplus
section: "4.8"
description: "A header separator never defines the column count; a separator wider than the count drops its surplus and emits CDN-0018"

input: |
  | A | B |
  |:---|---:|:---:|

diagnostics:
  - code: CDN-0018
    level: warning

ast:
  - _type: Table
    rows:
      - _type: Header
        children:
          - _type: Cell
            children:
              - _type: Text
                value: A
          - _type: Cell
            children:
              - _type: Text
                value: B
    columns:
      - _type: Column
        align: left
      - _type: Column
        align: right
