id: paragraph-linebreak
section: "4.1"
description: Backslash at end of line produces a LineBreak node; parsing continues on the next line

input: |
  First line\
  second line

ast:
  - _type: Paragraph
    children:
      - _type: Text
        value: First line
      - _type: LineBreak
      - _type: Text
        value: second line
