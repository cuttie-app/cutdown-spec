id: heading-inline-formatting
section: "4.2"
description: Heading text is full inline content; inline formatting is parsed normally

input: |
  = Title with __bold__ word

ast:
  - _type: Section
    level: 1
    heading:
      - _type: Text
        value: "Title with "
      - _type: Emphasis
        children:
          - _type: Text
            value: bold
      - _type: Text
        value: " word"
