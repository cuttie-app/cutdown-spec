id: table-simple
section: "4.8"
description: Pipe table with no header separator; all rows are type Row; columns default to start alignment

input: |
  | Cell A | Cell B |
  | Cell C | Cell D |

ast:
  - _type: Table
    rows:
      - _type: Row
        children:
          - _type: Cell
            row: 0
            column: 0
            children:
              - _type: Text
                value: Cell A
          - _type: Cell
            row: 0
            column: 1
            children:
              - _type: Text
                value: Cell B
      - _type: Row
        children:
          - _type: Cell
            row: 1
            column: 0
            children:
              - _type: Text
                value: Cell C
          - _type: Cell
            row: 1
            column: 1
            children:
              - _type: Text
                value: Cell D
    columns:
      - _type: Column
      - _type: Column
