id: table-pipe-plus-row-ignored
section: "4.8"
description: "A `+` row between pipe rows is ignored entirely — colons included: no Header marking, no alignment, table not interrupted"

input: |
  | A | B |
  +:--+--:+
  | C | D |

ast:
  - type: Table
    kind: pipe
    rows:
      - type: Row
        children:
          - type: Cell
            row: 0
            column: 0
            children:
              - type: Text
                value: A
          - type: Cell
            row: 0
            column: 1
            children:
              - type: Text
                value: B
      - type: Row
        children:
          - type: Cell
            row: 1
            column: 0
            children:
              - type: Text
                value: C
          - type: Cell
            row: 1
            column: 1
            children:
              - type: Text
                value: D
    columns:
      - type: Column
      - type: Column
