id: imageblock-not-only-segment-falls-back
section: "4.9"
description: "An image line carrying trailing content fails the only-segment rule and falls back to a Paragraph with an ImageInline — no content is dropped"

input: "![a](b) trailing text\n"

ast:
  - _type: Paragraph
    children:
      - _type: ImageInline
        src: "b"
        alt:
          - _type: Text
            value: "a"
      - _type: Text
        value: " trailing text"
