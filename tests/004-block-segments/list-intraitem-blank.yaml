id: list-intraitem-blank
section: "4.7"
description: Blank line + col-0 marker resets the list; blank line + indented content absorbed making item block-mode and list loose

input: |
  - First item

  - Second item

    This starts a new paragraph inside item two.

ast:
  - _type: List
    kind: "bullet"
    loose: false
    children:
      - _type: ListItem
        children:
          - _type: Text
            value: First item
  - _type: List
    kind: "bullet"
    loose: true
    children:
      - _type: ListItem
        children:
          - _type: Paragraph
            children:
              - _type: Text
                value: Second item
          - _type: Paragraph
            children:
              - _type: Text
                value: This starts a new paragraph inside item two.
