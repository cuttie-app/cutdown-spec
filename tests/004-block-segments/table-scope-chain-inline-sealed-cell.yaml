id: table-scope-chain-inline-sealed-cell
section: "4.8"
description: "Writing the closer seals the last cell's inline context before the chain begins, so the chain stops at Row and the leading {} is orphaned"

input: |
  | AA | **BB** | {.a}{.b}{.c}

diagnostics:
  - code: CDN-0011
    level: warning

ast:
  - _type: Table
    rows:
      - _type: Row
        children:
          - _type: Cell
            children:
              - _type: Text
                value: AA
          - _type: Cell
            children:
              - _type: Strong
                children:
                  - _type: Text
                    value: BB
        attributes:
          - key: class
            value: [b]
    attributes:
      - key: class
        value: [c]
