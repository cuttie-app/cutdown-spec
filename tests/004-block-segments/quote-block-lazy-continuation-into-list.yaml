id: quote-block-lazy-continuation-into-list
section: "4.6"
description: "A lazy continuation line is handed to the quote's current child block and follows that block's continuation rules — here a list item absorbs it"

input: |
  > - item one
  still item one

ast:
  - _type: QuoteBlock
    children:
      - _type: List
        kind: bullet
        loose: false
        children:
          - _type: ListItem
            children:
              - _type: Text
                value: item onestill item one
