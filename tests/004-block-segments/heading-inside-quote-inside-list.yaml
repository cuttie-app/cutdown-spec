id: heading-inside-quote-inside-list
section: "4.7"
description: A heading inside a QuoteBlock inside a list item is legal; the outer list is tight (single item, no blank lines)

input: |
  - > = Heading item

ast:
  - _type: List
    kind: "bullet"
    loose: false
    children:
      - _type: ListItem
        children:
          - _type: QuoteBlock
            children:
              - _type: Section
                level: 1
                heading:
                  - _type: Text
                    value: Heading item
