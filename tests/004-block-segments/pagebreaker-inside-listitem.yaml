id: pagebreaker-inside-listitem
section: "4.10"
description: A blank-line-surrounded --- inside a list item is not a PageBreaker; it parses as a literal paragraph and CDN-0017 is emitted

input: |
  - item

    ---

    after

diagnostics:
  - code: CDN-0017
    level: warning

ast:
  - _type: List
    kind: "bullet"
    loose: true
    children:
      - _type: ListItem
        children:
          - _type: Paragraph
            children:
              - _type: Text
                value: item
          - _type: Paragraph
            children:
              - _type: Text
                value: "---"
          - _type: Paragraph
            children:
              - _type: Text
                value: after
