id: table-pipe-explicit-empty-last-cell
section: "4.8"
description: "The last | is the closer, never a separator; an explicit empty final cell needs its own | before the closer"

input: |
  | A | B | |

ast:
  - type: Table
    kind: pipe
    rows:
      - type: Row
        children:
          - type: Cell
            children:
              - type: Text
                value: A
          - type: Cell
            children:
              - type: Text
                value: B
          - type: Cell
            children: []
    columns:
      - type: Column
        align: left
      - type: Column
        align: left
      - type: Column
        align: left
