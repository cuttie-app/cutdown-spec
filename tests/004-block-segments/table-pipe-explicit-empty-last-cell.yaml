id: table-pipe-explicit-empty-last-cell
section: "4.8"
description: "The last | is the closer, never a separator; an explicit empty final cell needs its own | before the closer"

input: |
  | A | B | |

ast:
  - _type: Table
    rows:
      - _type: Row
        children:
          - _type: Cell
            children:
              - _type: Text
                value: A
          - _type: Cell
            children:
              - _type: Text
                value: B
          - _type: Cell
            children: []
    columns:
      - _type: Column
        align: start
      - _type: Column
        align: start
      - _type: Column
        align: start
