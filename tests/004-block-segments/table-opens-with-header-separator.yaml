id: table-opens-with-header-separator
section: "4.8"
description: "A table whose only line is a header separator gets one inserted empty Header row; with no content row to fix the column count, columns is empty"

input: |
  |:---|----|

diagnostics: []

ast:
  - _type: Table
    rows:
      - _type: Header
        children:
          - _type: Cell
            row: 0
            column: 0
            children: []
          - _type: Cell
            row: 0
            column: 1
            children: []


    columns:
      - _type: Column
        align: left
      - _type: Column
        align: start
