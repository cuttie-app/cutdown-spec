id: inline-symmetric-eof
section: "19"
description: "An unclosed symmetric delimiter is literal at EOF, then becomes Strong when its closer arrives"

input: "**draft**"

ast:
  - _type: Paragraph
    children:
      - _type: Strong
        children:
          - _type: Text
            value: draft

streaming:
  unit: unicode-scalar
  checkpoints:
    - at: 0
      ast: []
      diagnostics: []
    - at: 2
      ast:
        - _type: Paragraph
          children:
            - _type: Text
              value: "**"
      diagnostics: []
    - at: 7
      ast:
        - _type: Paragraph
          children:
            - _type: Text
              value: "**draft"
      diagnostics: []
