id: heading-trailing-spaces-dropped
section: "12.1"
description: "Trailing spaces on a heading line are dropped: the end of a single-line block's inline context is a block boundary, not a soft break"

input: |
  = Title  

  Body

ast:
  - _type: Section
    level: 1
    heading:
      - _type: Text
        value: Title
    children:
      - _type: Paragraph
        children:
          - _type: Text
            value: Body
