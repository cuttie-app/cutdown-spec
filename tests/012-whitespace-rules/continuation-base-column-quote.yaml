id: continuation-base-column-quote
section: "12.1"
description: "A lazy line in a nested quote is measured from the quote's base column (2 per level): one column beyond it gives a space, none gives nothing"

input: "> > with\n     space in between\n\n> > no\n    spaces\n    at\n    all\n"

ast:
  - _type: QuoteBlock
    children:
      - _type: QuoteBlock
        children:
          - _type: Text
            value: "with space in between"
  - _type: QuoteBlock
    children:
      - _type: QuoteBlock
        children:
          - _type: Text
            value: "nospacesatall"
