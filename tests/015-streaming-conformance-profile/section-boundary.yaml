id: section-boundary
section: "15"
description: "A later heading may close an earlier Section while every source prefix remains a normal document"

input: "= One\n\n== Two"

ast:
  - _type: Section
    level: 1
    heading:
      - _type: Text
        value: One
    children:
      - _type: Section
        level: 2
        heading:
          - _type: Text
            value: Two

streaming:
  unit: unicode-scalar
  checkpoints:
    - at: 5
      ast:
        - _type: Section
          level: 1
          heading:
            - _type: Text
              value: One
      diagnostics: []
