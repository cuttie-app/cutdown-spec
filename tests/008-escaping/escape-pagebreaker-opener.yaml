id: escape-pagebreaker-opener
section: "8.2"
description: "`\\---` at line start → literal `---`; no page break occurs. Whole sample stays in one Page, joined into one Paragraph (no blank-line separator)."

input: |
  para before
  \---
  para after

ast:
  - _type: Paragraph
    children:
      - _type: Text
        value: "para before---para after"
