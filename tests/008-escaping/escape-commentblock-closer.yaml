id: escape-commentblock-closer
section: "8.3"
description: "`\\#` inside a CommentBlock body emits literal `#`; the escaped triple-octothorpe line does NOT close the fence"

input: |
  ###
  notes
  \###
  more notes
  ###

pages:
  - reflections:
      - text: "notes\n###\nmore notes"
        before: [0]
    children: []
