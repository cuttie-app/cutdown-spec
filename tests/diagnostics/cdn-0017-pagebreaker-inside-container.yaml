id: cdn-0017-pagebreaker-inside-container
section: "4.10"
description: A blank-line-surrounded --- inside a block container parses as a literal paragraph; CDN-0017 is emitted

input: |
  > quoted

  - item

    ---

diagnostics:
  - code: CDN-0017
    level: warning

ast:
  - _type: QuoteBlock
    children:
      - _type: Text
        value: quoted
  - _type: List
    kind: "bullet"
    loose: true
    children:
      - _type: ListItem
        children:
          - _type: Paragraph
            children:
              - _type: Text
                value: item
          - _type: Paragraph
            children:
              - _type: Text
                value: "---"
