id: cdn-0032-no-fire-url
section: "5.9.1"
description: "CDN-0032 does not fire for a URL: an https:// image source is an EmbedImageInline whose url is never validated"

input: |
  ![x](https://example.com//a.png)

ast:
  - _type: Paragraph
    children:
      - _type: EmbedImageInline
        url: "https://example.com//a.png"
