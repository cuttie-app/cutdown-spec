id: cdn-0016-pagebreak-tail-dropped
section: "4.10"
description: "Anything after the leading --- on a PageBreak line is dropped; the page boundary takes effect, no node is produced, and CDN-0016 is emitted"

input: |
  Before

  --- some text {.x}

  After

diagnostics:
  - code: CDN-0016
    level: warning

pages:
  - children:
      - type: Paragraph
        children:
          - type: Text
            value: Before
  - children:
      - type: Paragraph
        children:
          - type: Text
            value: After
