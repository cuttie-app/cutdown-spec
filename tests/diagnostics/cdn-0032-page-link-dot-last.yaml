id: cdn-0032-page-link-dot-last
section: "9.2.5"
description: "CDN-0032: a page path ending in . normalizes to a trailing /, which is invalid in a link"

input: |
  [x](a/.)

ast:
  - _type: Paragraph
    children:
      - _type: Link
        kind: page
        raw: a/.
        path: null

diagnostics:
  - code: CDN-0032
    level: warning
