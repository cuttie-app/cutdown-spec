id: cdn-0014-emphasis-strong-cross
section: "5.2"
description: "__ closes while ** is open inside its content; CDN-0014 at the crossing __ closer; trailing ** is orphaned literal"

input: |
  __ a ** b __ c **

ast:
  - type: Paragraph
    children:
      - type: Emphasis
        children:
          - type: Text
            value: "a ** b"
      - type: Text
        value: " c **"

diagnostics:
  - code: CDN-0014
    level: warning
