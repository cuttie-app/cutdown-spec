id: cdn-0008-orphaned-caption-after-image-paragraph
section: "6.2"
description: "CDN-0008: an image alone on a line is a Paragraph, which is not captionable, so the following `^ ` line is orphaned and stays literal"

input: |
  ![a](b)
  ^ A caption

ast:
  - _type: Paragraph
    children:
      - _type: ImageInline
        alt:
          - _type: Text
            value: a
        src:
          raw: "b"
          path: "b"
  - _type: Paragraph
    children:
      - _type: Text
        value: "^ A caption"

diagnostics:
  - code: CDN-0008
    level: warning
