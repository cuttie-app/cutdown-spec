id: cdn-0017-no-fire-glued-hyphens
section: "4.10"
description: A --- line glued to a preceding paragraph inside a container is ordinary paragraph content; no diagnostic is emitted

input: |
  > quoted
  > ---

diagnostics: []

ast:
  - _type: QuoteBlock
    children:
      - _type: Paragraph
        children:
          - _type: Text
            value: "quoted---"
