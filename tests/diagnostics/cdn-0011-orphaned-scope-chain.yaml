id: cdn-0011-orphaned-scope-chain
section: "6.1.2"
description: "Three {} tokens on a 2-slot list context; the front token has no slot to claim, is discarded, and emits CDN-0011"

input: |
  - text {.a}{.b}{.c}

diagnostics:
  - code: CDN-0011
    level: warning

ast:
  - type: List
    kind: "bullet"
    attributes:
      - key: class
        value: [c]
    children:
      - type: ListItem
        attributes:
          - key: class
            value: [b]
        children:
          - type: Text
            value: text
