id: cdn-0008-orphaned-caption-slot-filled
section: "6.2"
description: "CDN-0008: after the first `^ ` line fills the caption slot, a second `^ ` line has no captionable predecessor (pointer cleared); emitted as Paragraph"

input: |
  | col |
  ^ First caption
  ^ Second caption

ast:
  - _type: Table
    caption:
      - _type: Text
        value: "First caption"
    rows:
      - _type: Row
        children:
          - _type: Cell
            children:
              - _type: Text
                value: col
  - _type: Paragraph
    children:
      - _type: Text
        value: "^ Second caption"

diagnostics:
  - code: CDN-0008
    level: warning
