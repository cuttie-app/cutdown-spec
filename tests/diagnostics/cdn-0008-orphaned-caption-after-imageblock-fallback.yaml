id: cdn-0008-orphaned-caption-after-imageblock-fallback
section: "6.2"
description: "CDN-0008: an ImageBlock that fell back to a Paragraph is not captionable, so the following `^ ` line is orphaned and stays literal"

input: |
  ![a](b) trailing text
  ^ A caption

ast:
  - _type: Paragraph
    children:
      - _type: ImageInline
        alt:
          - _type: Text
            value: a
        src: "b"
      - _type: Text
        value: " trailing text"
  - _type: Paragraph
    children:
      - _type: Text
        value: "^ A caption"

diagnostics:
  - code: CDN-0008
    level: warning
