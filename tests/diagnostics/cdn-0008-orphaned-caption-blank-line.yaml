id: cdn-0008-orphaned-caption-blank-line
section: "6.2"
description: "CDN-0008: a blank line between a captionable block and a `^ ` line breaks binding; the `^ ` is orphaned"

input: |
  /photo.jpg

  ^ Orphaned caption

ast:
  - _type: FileGroup
    children:
      - _type: FileBlock
        src:
          path: "/photo.jpg"
        caption: []
  - _type: Paragraph
    children:
      - _type: Text
        value: "^ Orphaned caption"

diagnostics:
  - code: CDN-0008
    level: warning
