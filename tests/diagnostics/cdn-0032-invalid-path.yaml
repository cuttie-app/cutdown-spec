id: cdn-0032-invalid-path
section: "9.2.5"
description: "CDN-0032: an empty path segment makes a page path invalid; the Link is kept with raw as written and path null"

input: |
  [x](a//b)

ast:
  - _type: Paragraph
    children:
      - _type: Link
        kind: page
        raw: a//b
        path: null

diagnostics:
  - code: CDN-0032
    level: warning
