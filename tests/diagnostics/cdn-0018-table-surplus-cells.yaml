id: cdn-0018-table-surplus-cells
section: "4.8"
description: "A content row with more cells than the column count fixed by the first content row has the surplus dropped and emits CDN-0018"

input: |
  | A | B |
  | C | D | E | F |

diagnostics:
  - code: CDN-0018
    level: warning

ast:
  - _type: Table
    rows:
      - _type: Row
        children:
          - _type: Cell
            children:
              - _type: Text
                value: A
          - _type: Cell
            children:
              - _type: Text
                value: B
      - _type: Row
        children:
          - _type: Cell
            children:
              - _type: Text
                value: C
          - _type: Cell
            children:
              - _type: Text
                value: D
    columns:
      - _type: Column
        align: start
      - _type: Column
        align: start
