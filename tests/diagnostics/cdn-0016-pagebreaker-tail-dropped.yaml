id: cdn-0016-pagebreaker-tail-dropped
section: "4.10"
description: "Anything after the leading --- on a PageBreaker line is dropped; the page boundary takes effect, no node is produced, and CDN-0016 is emitted"

input: |
  Before

  --- some text {.x}

  After

diagnostics:
  - code: CDN-0016
    level: warning

pages:
  - children:
      - _type: Paragraph
        children:
          - _type: Text
            value: Before
  - children:
      - _type: Paragraph
        children:
          - _type: Text
            value: After
