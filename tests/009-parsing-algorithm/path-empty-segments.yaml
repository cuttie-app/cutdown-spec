id: path-empty-segments
section: "9.2.4"
description: "Empty segments collapse silently: //x.png and /a//b.png are valid paths"

input: |
  //x.png
  /a//b.png

ast:
  - _type: FileGroup
    children:
      - _type: FileBlock
        raw: //x.png
        src:
          path: /x.png
          query: []
          fragment: ""
      - _type: FileBlock
        raw: /a//b.png
        src:
          path: /a/b.png
          query: []
          fragment: ""
