id: attrs-key-split-two-tokens
section: "6.1.1"
description: "A line end ends an attribute key: a key split over two lines becomes a flag followed by another token"

input: "**b**{data-\nx=1} end\n"

ast:
  - _type: Paragraph
    children:
      - _type: Strong
        children:
          - _type: Text
            value: b
        attributes:
          - key: data-
            value: ""
          - key: x
            value: "1"
      - _type: Text
        value: " end"
