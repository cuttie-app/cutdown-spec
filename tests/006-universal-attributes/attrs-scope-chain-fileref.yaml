id: attrs-scope-chain-fileref
section: "6.1.2"
description: "Two trailing {} on FileRef: last to FileRefGroup, preceding to FileRef"

input: |
  /img.png {.a}{.b}

ast:
  - _type: FileRefGroup
    group: image
    children:
      - _type: FileRef
        path: /img.png
        query: ''
        fragment: ''
        attributes:
          - key: class
            value: [a]
    attributes:
      - key: class
        value: [b]
