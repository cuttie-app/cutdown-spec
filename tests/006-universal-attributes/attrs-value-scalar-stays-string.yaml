id: attrs-value-scalar-stays-string
section: "6.1.1"
description: "Every attribute value is a string: key=123 and key=true stay \"123\" and \"true\""

input: |
  Hello {n=123 flag=true}

ast:
  - _type: Paragraph
    children:
      - _type: Text
        value: Hello
    attributes:
      - key: n
        value: "123"
      - key: flag
        value: "true"
