id: attrs-scope-chain-mark-2
section: "6.1.2"
description: "Two trailing {} on list item with Mark: last to List, preceding to ListItem (Mark gets nothing)"

input: |
  - ::sp:: {.a}{.b}

ast:
  - _type: List
    kind: "bullet"
    loose: false
    children:
      - _type: ListItem
        children:
          - _type: Mark
            name: sp
        attributes:
          - key: class
            value: [a]
    attributes:
      - key: class
        value: [b]
