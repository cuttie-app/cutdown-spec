id: caption-second-line-is-paragraph
section: "6.2"
description: "The first `^ ` line fills the caption slot; a second consecutive `^ ` line has no captionable predecessor (slot filled) — emitted as Paragraph + CDN-0008"

input: |
  | col |
  ^ First caption
  ^ Second caption

ast:
  - _type: Table
    caption:
      - _type: Text
        value: "First caption"
    rows:
      - _type: Row
        children:
          - _type: Cell
            children:
              - _type: Text
                value: col
  - _type: Paragraph
    children:
      - _type: Text
        value: "^ Second caption"

diagnostics:
  - code: CDN-0008
    level: warning
