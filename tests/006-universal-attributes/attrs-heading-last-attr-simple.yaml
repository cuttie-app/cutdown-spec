id: attrs-heading-last-attr-simple
section: "6.1.2"
description: "Last-attr rule: single trailing {} on heading line goes to Section; inline element gets no attrs"

input: |
  = Heading **bold** {#h}

ast:
  - _type: Section
    level: 1
    heading:
      - _type: Text
        value: "Heading "
      - _type: Strong
        children:
          - _type: Text
            value: bold
    attributes:
      - key: id
        value: h
