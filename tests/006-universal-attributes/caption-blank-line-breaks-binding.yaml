id: caption-blank-line-breaks-binding
section: "6.2"
description: "A blank line between a captionable block and a `^ ` line breaks the binding; the `^ ` line is orphaned (CDN-0008) and emitted as a Paragraph"

input: |
  | col |

  ^ Caption text

ast:
  - _type: Table
    rows:
      - _type: Row
        children:
          - _type: Cell
            children:
              - _type: Text
                value: col
  - _type: Paragraph
    children:
      - _type: Text
        value: "^ Caption text"

diagnostics:
  - code: CDN-0008
    level: warning
