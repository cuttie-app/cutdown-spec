id: caption-comment-own-line-transparent
section: "6.2"
description: "A standalone `## comment` line directly after a table does not break caption binding — the payload attaches to the table's last row; no sibling node is emitted"

input: |
  | col |
  ## editorial note
  ^ Caption text

ast:
  - _type: Table
    caption:
      - _type: Text
        value: "Caption text"
    rows:
      - _type: Row
        reflections:
          - loc: { start: 11, end: 25 }
            text: "editorial note"
        children:
          - _type: Cell
            children:
              - _type: Text
                value: col
