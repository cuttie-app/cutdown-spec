id: attrs-link-text-orphan
section: "6.1.4"
description: "Leading {attrs} inside link brackets with no preceding element is orphan — emitted as literal text"

input: |
  [{.foo} text](https://example.com)

ast:
  - _type: Paragraph
    children:
      - _type: Link
        kind: external
        href: https://example.com
        children:
          - _type: Text
            value: "{.foo} text"
