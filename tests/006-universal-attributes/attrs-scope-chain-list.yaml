id: attrs-scope-chain-list
section: "6.1.2"
description: "Two trailing {} on a list item distribute right-to-left: last to List, preceding to ListItem"

input: |
  - item {.item-class}{.list-class}

ast:
  - _type: List
    kind: "bullet"
    attributes:
      - key: class
        value: [list-class]
    children:
      - _type: ListItem
        attributes:
          - key: class
            value: [item-class]
        children:
          - _type: Text
            value: item
