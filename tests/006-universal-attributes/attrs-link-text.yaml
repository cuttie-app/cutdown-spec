id: attrs-link-text
section: "6.1.4"
description: "{attrs} inside link brackets attaches to preceding inline; leading {attrs} with no preceding element is orphan (literal)"

input: |
  [**bold** {.foo}](url)

ast:
  - _type: Paragraph
    children:
      - _type: Link
        kind: external
        href: url
        children:
          - _type: Strong
            children:
              - _type: Text
                value: bold
            attributes:
              - key: class
                value: [foo]
