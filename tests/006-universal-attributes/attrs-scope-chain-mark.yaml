id: attrs-scope-chain-mark
section: "6.1.2"
description: "Three trailing {} on list item with Mark: distribute right-to-left — last to List, middle to ListItem, first to Mark"

input: |
  - ::sp:: {.a}{.b}{.c}

ast:
  - type: List
    kind: "bullet"
    loose: false
    children:
      - type: ListItem
        children:
          - type: Mark
            name: sp
            attributes:
              - key: class
                value: [a]
        attributes:
          - key: class
            value: [b]
    attributes:
      - key: class
        value: [c]
