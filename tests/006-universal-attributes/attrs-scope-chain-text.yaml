id: attrs-scope-chain-text
section: "6.1.2"
description: "Text list items: two trailing {} distribute right-to-left — last to List, preceding to ListItem"

input: |
  - text {.a}{.b}

ast:
  - _type: List
    kind: "bullet"
    loose: false
    children:
      - _type: ListItem
        children:
          - _type: Text
            value: text
        attributes:
          - key: class
            value: [a]
    attributes:
      - key: class
        value: [b]
