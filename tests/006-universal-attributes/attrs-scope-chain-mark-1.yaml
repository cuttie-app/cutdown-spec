id: attrs-scope-chain-mark-1
section: "6.1.2"
description: "Single trailing {} on list item with Mark: goes to List (ListItem and Mark get nothing)"

input: |
  - ::sp:: {.a}

ast:
  - _type: List
    kind: "bullet"
    loose: false
    children:
      - _type: ListItem
        children:
          - _type: Mark
            name: sp
    attributes:
      - key: class
        value: [a]
