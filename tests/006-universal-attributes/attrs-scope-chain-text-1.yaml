id: attrs-scope-chain-text-1
section: "6.1.2"
description: "Single trailing {} on text list item goes to List"

input: |
  - text {.a}

ast:
  - _type: List
    kind: "bullet"
    loose: false
    children:
      - _type: ListItem
        children:
          - _type: Text
            value: text
    attributes:
      - key: class
        value: [a]
