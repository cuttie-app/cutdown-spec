id: caption-multiple-transparent-lines
section: "6.2"
description: "Any number of block-emitting-nothing lines may intervene: an {attrs} line and a standalone ## comment line together are both transparent, and the caption still binds"

input: |
  | col |
  {#tbl-one}
  ## editorial note
  ^ Caption text

ast:
  - _type: Table
    caption:
      - _type: Text
        value: "Caption text"
    rows:
      - _type: Row
        children:
          - _type: Cell
            children:
              - _type: Text
                value: col
    attributes:
      - key: id
        value: "tbl-one"
