id: attrs-scope-chain-mark-noop
section: "6.1.2"
description: "Empty {} as last token is no-op on List; preceding {.a} goes to ListItem"

input: |
  - ::sp:: {.a}{}

ast:
  - _type: List
    kind: "bullet"
    loose: false
    children:
      - _type: ListItem
        children:
          - _type: Mark
            name: sp
        attributes:
          - key: class
            value: [a]
