id: whitespace-adjacent-inlines
section: "15.2"
description: "Two separate inline elements separated by a space — space is preserved as Text(\" \") between them"

input: |
  ** bb ** __ cc __

ast:
  - _type: Paragraph
    children:
      - _type: Strong
        children:
          - _type: Text
            value: bb
      - _type: Text
        value: " "
      - _type: Emphasis
        children:
          - _type: Text
            value: cc
